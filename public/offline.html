<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Fynlo</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fafafa;
        color: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px;
        text-align: center;
        gap: 16px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #fafafa; }
        .card { background: #1a1a1a; border-color: #2a2a2a; }
        button { background: #fafafa; color: #111; }
        button:active { background: #ddd; }
      }
      .icon { font-size: 56px; line-height: 1; }
      .card {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 16px;
        padding: 32px 24px;
        max-width: 360px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }
      h1 { font-size: 20px; font-weight: 700; }
      p { font-size: 14px; color: #888; line-height: 1.5; }
      button {
        margin-top: 8px;
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        background: #111;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      button:active { opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>You're offline</h1>
      <p>Fynlo needs a connection to load. Check your internet and try again.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
